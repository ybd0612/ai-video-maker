<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 防主题闪白（FOUC）：React 挂载前从 localStorage（zustand persist: wxhb-settings）
      // 预读 theme 写到 <html data-theme>；默认 light（白色），解析失败也按 light。
      // React 挂载后由 App.tsx 的 effect 接管同步。
      (function () {
        var theme = "light";
        try {
          var raw = localStorage.getItem("wxhb-settings");
          if (raw) {
            var t = (JSON.parse(raw).state || {}).theme;
            if (t === "dark") theme = "dark";
          }
        } catch (e) {
          /* 解析失败按默认 light */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>AI Video Maker &mdash; AI 一键成片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
