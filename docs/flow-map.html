<style>

    --bg: #0e1015; --surface: #171a21; --ink: #e8ebf0; --ink-3: #a3adbd; --ink-4: #6b7688;

  header .hint { color: var(--ink-4); font-size: 12px; margin-left: auto; }
  button, input, select {

  button { cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #search { width: 180px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; overflow: auto; position: relative; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  svg { display: block; }
  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .node .zh { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .node .en { font-size: 10.5px; fill: var(--ink-4); font-family: ui-monospace, Consolas, monospace; }
  .node.k-input rect { stroke-dasharray: 4 3; }
  .node.k-api rect { stroke: var(--accent); stroke-width: 1.6; }
  .node.k-out rect { fill: var(--surface); stroke: var(--id-edge); }
  .node.dim { opacity: .14; }
  .node.sel rect { stroke: var(--hl); stroke-width: 2.4; }
  .node.near rect { stroke: var(--accent); stroke-width: 1.8; }
  .node.hit rect { stroke: var(--hl); stroke-width: 2; }
  .edge { fill: none; stroke-width: 1.4; }
  .edge.t-text { stroke: var(--text-edge); }
  .edge.t-image { stroke: var(--image-edge); stroke-width: 2.2; }
  .edge.t-id { stroke: var(--id-edge); }
  .edge.t-artifact { stroke: var(--artifact-edge); }
  .edge.t-invalidate { stroke: var(--invalid-edge); stroke-dasharray: 6 3; }
  .edge.t-consume { stroke: var(--consume-edge); stroke-dasharray: 2 3; }
  .edge.dim { opacity: .06; }
  .edge.active { stroke-width: 3; opacity: 1; }
  .edge.off { opacity: .3; }
  .colhead { font-size: 11px; font-weight: 700; fill: var(--ink-4); letter-spacing: .06em; }
  #panel {
    width: 350px; flex: none; border-left: 1px solid var(--line); background: var(--surface);
    padding: 14px 16px 28px; overflow: auto;
  }
  #panel h2 { font-size: 16px; margin: 0 0 2px; }
  #panel h3 { font-size: 11px; margin: 15px 0 4px; color: var(--ink-3); letter-spacing: .06em; }
  #panel p, #panel li { font-size: 13px; margin: 0; }
  #panel ul { margin: 0; padding-left: 18px; }
  .code, #panel .code { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--ink-4); word-break: break-all; }

  .edge-row b { font-weight: 600; }
  .edge-row .tag { font-size: 11px; color: var(--ink-4); }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); cursor: pointer; padding: 2px 4px; border-radius: 4px; }

  #legend i { width: 22px; height: 0; border-top-width: 2.4px; border-top-style: solid; display: inline-block; }
  #tip {
    position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 4px 9px; border-radius: 5px; font-size: 12px; opacity: 0; transition: opacity .12s;

</style>
</head>
<body>
<header>

  <button id="theme">主题</button>

</header>

  <aside id="panel"><div id="panelBody"></div></aside>

  /* 失效级联（改了前者，后者成果被清空） */
  { f: "shVisual", t: "shotImg", type: "invalidate", label: "改画面字段 → 图片与视频一并作废" },
  { f: "shIds", t: "shotImg", type: "invalidate", label: "改引用 → 图片与视频作废" },
  { f: "shSub", t: "shotImg", type: "invalidate", label: "改画面子字段 → 图片与视频作废" },

  { f: "shMotion", t: "shotVideo", type: "invalidate", label: "改动态字段 → 只作废视频，保留图片" },
  { f: "shDur", t: "shotVideo", type: "invalidate", label: "改时长 → 只作废视频" },

  { f: "assetImg", t: "shotImg", type: "invalidate", label: "资产参考图变化 → 引用它的镜头图片视频作废" },
  { f: "assetImg", t: "reviews", type: "invalidate", label: "同时把三个审核标记重置为 false（门禁重锁）" },
  { f: "aStyle", t: "shotImg", type: "invalidate", label: "风格资产变化 → 命中全部镜头，图视频全清" },
  { f: "vd", t: "assetImg", type: "invalidate", label: "改视觉方向 → 清空所有资产参考图" },
  { f: "aChar", t: "assetImg", type: "invalidate", label: "改设定/名称/外观 → 该资产参考图作废 + 门禁重锁" },

  /* 消耗限额 */
  { f: "apiText", t: "limiter", type: "consume", label: "每次占 1 个文本槽位（参数元调用也占一次）" },
  { f: "apiImage", t: "limiter", type: "consume", label: "按 1K/2K/3K/4K 档位占图片槽位" },

<script>
/* ──────────────────────────────────────────────────────────────────────────
   渲染与交互
   ────────────────────────────────────────────────────────────────────────── */
const TYPES = {
  text: { name: "文字注入", color: "var(--text-edge)" },
  image: { name: "图像注入", color: "var(--image-edge)" },
  id: { name: "引用绑定", color: "var(--id-edge)" },
  artifact: { name: "产物依赖", color: "var(--artifact-edge)" },
  invalidate: { name: "失效级联", color: "var(--invalid-edge)", dash: "dashed" },
  consume: { name: "消耗限额", color: "var(--consume-edge)", dash: "dotted" },
};

const NW = 214, NH = 52, GAPX = 112, GAPY = 18, PADX = 30, PADY = 62;
const byId = new Map(NODES.map(n => [n.id, n]));
NODES.forEach(n => { n.in = []; n.out = []; });
const EDGES_OK = EDGES.filter(e => {
  if (!byId.has(e.f) || !byId.has(e.t)) { console.warn("边引用了不存在的节点，已忽略：", e); return false; }
  return true;
});
EDGES_OK.forEach(e => { byId.get(e.f).out.push(e); byId.get(e.t).in.push(e); });

const buckets = COLS.map((_, i) => NODES.filter(n => n.col === i));
const rowH = NH + GAPY;
buckets.forEach(list => list.forEach((n, ri) => {
  n.x = PADX + n.col * (NW + GAPX);
  n.y = PADY + ri * rowH;
}));
const maxRows = Math.max(...buckets.map(b => b.length));
const W = PADX * 2 + COLS.length * NW + (COLS.length - 1) * GAPX;
const H = PADY + maxRows * rowH + 20;

const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs) => {
  const el = document.createElementNS(NS, tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
};
const svg = document.getElementById("svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

COLS.forEach((title, ci) => {
  const t = mk("text", { x: PADX + ci * (NW + GAPX), y: 30, class: "colhead" });
  t.textContent = title;
  svg.appendChild(t);
});

const edgeLayer = mk("g");
const nodeLayer = mk("g");
svg.append(edgeLayer, nodeLayer);

EDGES_OK.forEach(e => {
  const a = byId.get(e.f), b = byId.get(e.t);
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  const back = b.col <= a.col;                       // 反向边绕行，减少穿越
  const dip = back ? 54 : 0;
  const dx = Math.max(60, Math.abs(x2 - x1) * 0.45);
  const d = `M ${x1} ${y1} C ${x1 + dx} ${y1 + dip}, ${x2 - dx} ${y2 + dip}, ${x2} ${y2}`;
  const p = mk("path", { d, class: `edge t-${e.type}${e.off ? " off" : ""}` });
  const label = `${a.zh} ${e.off ? "【已停用】" : "→"} ${b.zh}：${e.label}`;
  p.addEventListener("mouseenter", ev => showTip(label, ev));
  p.addEventListener("mouseleave", hideTip);
  edgeLayer.appendChild(p);
  e.el = p;
});

NODES.forEach(n => {
  const g = mk("g", { class: `node k-${n.kind}` });
  g.appendChild(mk("rect", { x: n.x, y: n.y, width: NW, height: NH, rx: 8 }));
  const t1 = mk("text", { x: n.x + 11, y: n.y + 21, class: "zh" });
  t1.textContent = n.zh;
  const t2 = mk("text", { x: n.x + 11, y: n.y + 38, class: "en" });
  t2.textContent = n.en.length > 34 ? `${n.en.slice(0, 33)}…` : n.en;
  g.append(t1, t2);
  g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
  g.addEventListener("mouseenter", ev => showTip(`${n.zh} ｜ ${n.en} ｜ 点击查看引用链`, ev));
  g.addEventListener("mouseleave", hideTip);
  nodeLayer.appendChild(g);
  n.el = g;
});

let selected = null, typeFilter = null, invalidOnly = false;
const dirSel = document.getElementById("dir");

function reachable(startId, dir) {
  const seen = new Set([startId]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    const node = byId.get(cur);
    const list = dir === "down" ? node.out : dir === "up" ? node.in : node.out.concat(node.in);
    list.forEach(e => {
      const nxt = e.f === cur ? e.t : e.f;
      if (!seen.has(nxt)) { seen.add(nxt); queue.push(nxt); }
    });
  }
  return seen;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const hits = q
    ? new Set(NODES.filter(n =>
        `${n.zh} ${n.en} ${n.mean} ${n.consumers} ${n.producer}`.toLowerCase().includes(q)).map(n => n.id))
    : null;

  let chain = null;
  if (invalidOnly) {
    chain = new Set();
    EDGES_OK.filter(e => e.type === "invalidate").forEach(e => { chain.add(e.f); chain.add(e.t); });
  } else if (selected) {
    chain = reachable(selected, dirSel.value);
  }

  NODES.forEach(n => {
    const cls = ["node", `k-${n.kind}`];
    if (hits && !hits.has(n.id)) cls.push("dim");
    if (chain) {
      if (n.id === selected) cls.push("sel");
      else if (chain.has(n.id)) cls.push("near");
      else cls.push("dim");
    } else if (hits && hits.has(n.id)) cls.push("hit");
    n.el.setAttribute("class", cls.join(" "));
  });

  EDGES_OK.forEach(e => {
    const cls = ["edge", `t-${e.type}`];
    if (e.off) cls.push("off");
    let visible = true;
    if (typeFilter && e.type !== typeFilter) visible = false;
    if (chain) {
      const touched = e.f === selected || e.t === selected;
      const within = chain.has(e.f) && chain.has(e.t);
      if (!within) visible = false;
      else if (touched) cls.push("active");
    }
    if (!visible) cls.push("dim");
    e.el.setAttribute("class", cls.join(" "));
  });
}

function select(id) {
  selected = id;
  invalidOnly = false;
  document.getElementById("onlyInvalid").classList.remove("on");
  render();
  paintPanel(id);
}

function clearSel() {
  selected = null;
  render();
  paintIntro();
}

function edgeRows(list) {
  return list.map(e => {
    const other = e.f === document.activePanelId ? byId.get(e.t) : byId.get(e.f);
    const arrow = e.f === document.activePanelId ? "→" : "←";
    return `<div class="edge-row"><b>${arrow} ${other.zh}</b>
      <span class="tag">（${TYPES[e.type].name}${e.off ? " · 已停用" : ""}）</span><br>${e.label}
      <div class="code">${other.en}</div></div>`;
  }).join("");
}

function paintPanel(id) {
  document.activePanelId = id;
  const n = byId.get(id);
  document.getElementById("panelBody").innerHTML = `
    <h2>${n.zh}</h2>
    <div class="code">${n.en}</div>
    <h3>是什么</h3><p>${n.mean}</p>
    <h3>谁产生</h3><p>${n.producer}</p>
    <h3>谁消费</h3><p>${n.consumers}</p>
    <h3>关联 ${n.out.length + n.in.length} 条</h3>
    ${edgeRows(n.out.concat(n.in)) || "<p>无</p>"}
    <h3>代码出处</h3><p class="code">${n.src}</p>`;
}

function paintIntro() {
  document.getElementById("panelBody").innerHTML = `
    <h2>怎么用这张图</h2>
    <ul>
      <li><strong>点任意方块</strong>：它的整条引用链高亮，其余淡出；右侧给出中文含义、谁产生、谁消费、代码出处。</li>
      <li><strong>顶部下拉</strong>切换「只看下游 / 只看上游」。</li>
      <li><strong>线的颜色 = 引用方式</strong>，点图例可只筛一种。</li>
      <li><strong>红色虚线 = 失效级联</strong>：改了左边，右边的成果就被清空。点「只看失效级联」一次看完。</li>
      <li><strong>橙色点线 = 消耗用量限额</strong>。</li>
      <li><strong>淡紫虚线 = 已停用的引用</strong>（风格母版与场景图不再进参考图），保留是为说明为什么停。</li>
    </ul>
    <h3>四条最该记住的</h3>
    <ul>
      <li>英文外观提示词 → 文字注入；参考图 → 图像注入；资产 ID → 引用绑定。</li>
      <li>资产参考图一次写回会连带清空引用镜头的图片和视频，并重锁三个审核门禁。</li>
      <li>镜头时长被规范化两次：4/5/8 → clamp 4..12。</li>
      <li>配额在发请求前扣，失败不回滚；非幂等的生图/生视频 POST 仍会自动重试。</li>
    </ul>
    <h3>数据出处</h3>
    <p class="code">2026-09-21 源码快照，与 docs/execution-flow.md、docs/idea-breakdown.md 同一轮逐条核对结果。</p>`;
}

const legend = document.getElementById("legend");
Object.entries(TYPES).forEach(([key, t]) => {
  const s = document.createElement("span");
  s.title = "点击只看这一类引用";
  s.innerHTML = `<i style="border-top-style:${t.dash || "solid"};border-top-color:${t.color}"></i>${t.name}`;
  s.addEventListener("click", () => {
    typeFilter = typeFilter === key ? null : key;
    [...legend.children].forEach(c => c.classList.toggle("on", c === s && typeFilter === key));
    render();
  });
  legend.appendChild(s);
});

document.getElementById("search").addEventListener("input", render);
dirSel.addEventListener("change", render);
document.getElementById("reset").addEventListener("click", clearSel);
const invalidBtn = document.getElementById("onlyInvalid");
invalidBtn.addEventListener("click", () => {
  invalidOnly = !invalidOnly;
  invalidBtn.classList.toggle("on", invalidOnly);
  if (invalidOnly) selected = null;
  render();
});
svg.addEventListener("dblclick", clearSel);

const stage = document.getElementById("stage");
let scale = 1;
function applyScale() {
  svg.style.width = `${W * scale}px`;
  svg.style.height = `${H * scale}px`;
}
applyScale();
stage.addEventListener("wheel", ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  scale = Math.min(2.4, Math.max(.4, scale * (ev.deltaY < 0 ? 1.12 : 0.9)));
  applyScale();
}, { passive: false });
let drag = null;
stage.addEventListener("mousedown", ev => {
  if (ev.target.closest(".node")) return;
  drag = { x: ev.clientX, y: ev.clientY, l: stage.scrollLeft, t: stage.scrollTop };
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", ev => {
  if (!drag) return;
  stage.scrollLeft = drag.l - (ev.clientX - drag.x);
  stage.scrollTop = drag.t - (ev.clientY - drag.y);
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });

const tip = document.getElementById("tip");
function showTip(text, ev) {
  tip.textContent = text;
  tip.style.left = `${Math.max(8, Math.min(innerWidth - 540, ev.clientX + 14))}px`;
  tip.style.top = `${ev.clientY + 16}px`;
  tip.style.opacity = "1";
}
function hideTip() { tip.style.opacity = "0"; }

document.getElementById("theme").addEventListener("click", () => {
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme === "dark" ? "light" : "dark";
});

paintIntro();
render();
</script>
</body>
</html>
