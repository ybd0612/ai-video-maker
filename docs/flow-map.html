<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Maker · 全链路引用关系交互图</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --ink: #15171c; --ink-3: #59616f; --ink-4: #8b94a3;
    --line: #d9dee6; --accent: #4f46e5; --tint: #eef0ff;
    --text-edge: #2563eb; --image-edge: #7c3aed; --id-edge: #0d9488;
    --artifact-edge: #9aa5b4; --invalid-edge: #dc2626; --consume-edge: #d97706; --hl: #f59e0b;
  }
  html[data-theme="dark"] {
    --bg: #0e1015; --surface: #171a21; --ink: #e9ecf1; --ink-3: #a3adbd; --ink-4: #6b7688;
    --line: #2a2f3a; --accent: #8b85f0; --tint: #1d2030;
    --text-edge: #60a5fa; --image-edge: #a78bfa; --id-edge: #2dd4bf;
    --artifact-edge: #64748b; --invalid-edge: #f87171; --consume-edge: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 700; white-space: nowrap; }
  button, input, select {
    font: inherit; font-size: 13px; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
  }
  button { cursor: pointer; white-space: nowrap; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #search { width: 168px; }
  #steps { display: flex; gap: 5px; align-items: center; }
  #steps b { font-size: 12px; color: var(--ink-4); font-weight: 500; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; overflow: auto; position: relative; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  svg { display: block; }
  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
  .node .zh { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .node .en { font-size: 10px; fill: var(--ink-4); font-family: ui-monospace, Consolas, monospace; }
  .node .badge { font-size: 9.5px; font-weight: 700; fill: var(--hl); }
  .node.k-input rect { stroke-dasharray: 4 3; }
  .node.k-act rect { fill: var(--tint); stroke: var(--accent); }
  .node.k-api rect { stroke: var(--consume-edge); stroke-width: 1.6; }
  .node.k-out rect { stroke: var(--id-edge); stroke-width: 1.6; }
  .node.dim { opacity: .11; }
  .node.gone { display: none; }
  .node.d1 rect { stroke: var(--hl); stroke-width: 2.6; }
  .node.d2 rect { stroke: var(--accent); stroke-width: 2; }
  .node.sel rect { stroke: var(--hl); stroke-width: 3.4; fill: var(--tint); }
  .node.hit rect { stroke: var(--hl); stroke-width: 2.4; }
  .edge { fill: none; stroke-width: 1.3; opacity: .8; }
  .edge.t-text { stroke: var(--text-edge); }
  .edge.t-image { stroke: var(--image-edge); stroke-width: 2; }
  .edge.t-id { stroke: var(--id-edge); }
  .edge.t-artifact { stroke: var(--artifact-edge); }
  .edge.t-invalidate { stroke: var(--invalid-edge); stroke-dasharray: 6 3; }
  .edge.t-consume { stroke: var(--consume-edge); stroke-dasharray: 2 3; }
  .edge.dim { opacity: .05; }
  .edge.gone { display: none; }
  .edge.active { stroke-width: 3.2; opacity: 1; }
  .edge.off { opacity: .26; }
  .elabel {
    font-size: 10.5px; fill: var(--ink-3); stroke: var(--bg); stroke-width: 3.5;
    paint-order: stroke; text-anchor: middle; display: none; pointer-events: none;
  }
  .elabel.show { display: block; }
  .colhead { font-size: 11.5px; font-weight: 700; fill: var(--ink-4); letter-spacing: .04em; }
  #panel {
    width: 360px; flex: none; border-left: 1px solid var(--line);
    background: var(--surface); padding: 14px 16px 30px; overflow: auto;
  }
  #panel h2 { font-size: 16px; margin: 0 0 2px; }
  #panel h3 { font-size: 11px; margin: 16px 0 5px; color: var(--ink-3); letter-spacing: .06em; }
  #panel p, #panel li { font-size: 13px; margin: 0 0 4px; }
  #panel ul { margin: 0; padding-left: 18px; }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--ink-4); word-break: break-all; }
  .grp { font-size: 11px; color: var(--ink-4); margin: 11px 0 3px; font-weight: 700; }
  .er { font-size: 12.5px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  .er:hover { background: var(--tint); }
  .er b { font-weight: 600; }
  .er .tag { font-size: 11px; color: var(--ink-4); }
  .er .how { color: var(--ink-3); }
  #legend { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
  #legend span {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3);
    cursor: pointer; padding: 2px 5px; border-radius: 4px; white-space: nowrap;
  }
  #legend span.on { background: var(--accent); color: #fff; }
  #legend i { width: 20px; height: 0; border-top-width: 2.4px; border-top-style: solid; display: inline-block; }
  #tip {
    position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 4px 9px; border-radius: 5px; font-size: 12px; opacity: 0; transition: opacity .12s;
    z-index: 9; max-width: 560px;
  }
</style>
</head>
<body>
<header>
  <h1>全链路引用关系图</h1>
  <div id="steps"><b>跳到</b></div>
  <input id="search" type="search" placeholder="搜中文或英文名…">
  <select id="dir">
    <option value="auto">方向自动</option>
    <option value="down">只看下游</option>
    <option value="up">只看上游</option>
    <option value="both">上下游</option>
  </select>
  <button id="onlyRelated">聚光灯（只留紧邻）</button>
  <button id="onlyInvalid">只看失效级联</button>
  <span id="legend"></span>
  <button id="fit">适应窗口</button>
  <button id="reset">清空</button>
  <button id="theme">主题</button>
</header>
<main>
  <div id="stage"><svg id="svg"></svg></div>
  <aside id="panel"><div id="panelBody"></div></aside>
</main>
<div id="tip"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════

   看不出某个字段到底用在哪一步。
   kind: input 输入 | act 动作 | art 拆解产物 | param 参数/横切 | out 结果

    producer: "四类资产提取", consumers: "主体参考图、镜头 activeProductIds" },
  { id: "aProp", col: 2, kind: "art", zh: "关键道具资产", en: "assets[type=prop]",

  { f: "shDur", t: "actVideoBatch", type: "text", label: "seconds = clamp(round(时长), 4, 12)" },
  { f: "apiVideo", t: "shotVideo", type: "artifact", label: "轮询完成后的视频地址" },
  { f: "shotVideo", t: "apiFfmpeg", type: "artifact", label: "videoUrls 数组，顺序即分镜顺序" },
  { f: "apiFfmpeg", t: "final", type: "artifact", label: "blob 播放地址" },
  { f: "reviews", t: "final", type: "artifact", label: "半自动逐级放行到成片" },
  { f: "styleImg", t: "shotRefs", type: "image", off: true, label: "已停用：母版内容会被整体复制" },
  { f: "aScene", t: "shotRefs", type: "image", off: true, label: "已停用：场景图会压平镜头差异" },

  /* 失效级联（改了前者，后者成果被清空） */
  { f: "shVisual", t: "shotImg", type: "invalidate", label: "改画面字段 → 图片与视频一并作废" },
  { f: "shScript", t: "shotImg", type: "invalidate", label: "改文案 → 图片与视频作废" },
  { f: "shIds", t: "shotImg", type: "invalidate", label: "改引用 → 图片与视频作废" },
  { f: "shSub", t: "shotImg", type: "invalidate", label: "改画面子字段 → 图片与视频作废" },
  { f: "shMotion", t: "shotVideo", type: "invalidate", label: "改动态字段 → 只作废视频" },
  { f: "shDur", t: "shotVideo", type: "invalidate", label: "改时长 → 只作废视频" },
  { f: "shDual", t: "shotVideo", type: "invalidate", label: "改首尾帧配置 → 只作废视频" },
  { f: "assetImg", t: "shotImg", type: "invalidate", label: "资产参考图变化 → 引用它的镜头图/视频作废" },
  { f: "assetImg", t: "reviews", type: "invalidate", label: "同时重置三个审核标记（门禁重锁）" },
  { f: "aStyle", t: "shotImg", type: "invalidate", label: "风格资产变化 → 命中全部镜头，图视频全清" },
  { f: "aStyle", t: "reviews", type: "invalidate", label: "同样重置三个审核标记" },
  { f: "appPrompt", t: "assetImg", type: "invalidate", label: "改外观提示词 → 该资产参考图作废" },
  { f: "aChar", t: "assetImg", type: "invalidate", label: "改设定或名称 → 该资产参考图作废" },
  { f: "vd", t: "assetImg", type: "invalidate", label: "改视觉方向 → 清空所有资产参考图" },
];
</script>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   渲染与交互：按跳数分层高亮；选中时在与它直接相连的线上直接写出用途
   ══════════════════════════════════════════════════════════════════════════ */
const TYPES = {
  text: { name: "文字注入", color: "var(--text-edge)" },
  image: { name: "图像注入", color: "var(--image-edge)" },
  id: { name: "引用绑定", color: "var(--id-edge)" },
  artifact: { name: "产物依赖", color: "var(--artifact-edge)" },
  invalidate: { name: "失效级联", color: "var(--invalid-edge)", dash: "dashed" },
  consume: { name: "走这次调用/占限额", color: "var(--consume-edge)", dash: "dotted" },
};

const NW = 216, NH = 52, GAPX = 108, GAPY = 16, PADX = 28, PADY = 60;
const byId = new Map(NODES.map(n => [n.id, n]));
NODES.forEach(n => { n.in = []; n.out = []; });
const EDGES_OK = EDGES.filter(e => {
  if (!byId.has(e.f) || !byId.has(e.t)) { console.warn("边引用了不存在的节点，已忽略：", e); return false; }
  return true;
});
EDGES_OK.forEach(e => { byId.get(e.f).out.push(e); byId.get(e.t).in.push(e); });

const buckets = COLS.map((_, i) => NODES.filter(n => n.col === i));
const rowH = NH + GAPY;
buckets.forEach(list => list.forEach((n, ri) => {
  n.x = PADX + n.col * (NW + GAPX);
  n.y = PADY + ri * rowH;
}));
const maxRows = Math.max(...buckets.map(b => b.length));
const W = PADX * 2 + COLS.length * NW + (COLS.length - 1) * GAPX;
const H = PADY + maxRows * rowH + 16;

const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs) => {
  const el = document.createElementNS(NS, tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
};
const svg = document.getElementById("svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

const edgeLayer = mk("g"), labelLayer = mk("g"), nodeLayer = mk("g");
COLS.forEach((title, ci) => {
  const t = mk("text", { x: PADX + ci * (NW + GAPX), y: 30, class: "colhead" });
  t.textContent = `${ci + 1}／${COLS.length} ${title}`;
  svg.appendChild(t);
});
svg.append(edgeLayer, labelLayer, nodeLayer);

EDGES_OK.forEach(e => {
  const a = byId.get(e.f), b = byId.get(e.t);
  const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  const back = b.col <= a.col;
  const dip = back ? 56 : 0;
  const dx = Math.max(56, Math.abs(x2 - x1) * 0.45);
  const p = mk("path", {
    d: `M ${x1} ${y1} C ${x1 + dx} ${y1 + dip}, ${x2 - dx} ${y2 + dip}, ${x2} ${y2}`,
    class: `edge t-${e.type}${e.off ? " off" : ""}`,
  });
  const txt = mk("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 + dip / 1.5 - 5, class: "elabel" });
  txt.textContent = e.label.length > 26 ? `${e.label.slice(0, 25)}…` : e.label;
  const tipText = `${a.zh} ${e.off ? "【已停用】" : "→"} ${b.zh}：${e.label}`;
  p.addEventListener("mouseenter", ev => showTip(tipText, ev));
  p.addEventListener("mouseleave", hideTip);
  p.addEventListener("click", ev => { ev.stopPropagation(); select(e.f); });
  edgeLayer.appendChild(p);
  labelLayer.appendChild(txt);
  e.el = p;
  e.labelEl = txt;
});

NODES.forEach(n => {
  const g = mk("g", { class: `node k-${n.kind}` });
  g.appendChild(mk("rect", { x: n.x, y: n.y, width: NW, height: NH, rx: 8 }));
  const t1 = mk("text", { x: n.x + 11, y: n.y + 21, class: "zh" });
  t1.textContent = n.zh;
  const t2 = mk("text", { x: n.x + 11, y: n.y + 37, class: "en" });
  t2.textContent = n.en.length > 36 ? `${n.en.slice(0, 35)}…` : n.en;
  const badge = mk("text", { x: n.x + NW - 8, y: n.y + 15, class: "badge" });
  badge.setAttribute("text-anchor", "end");
  g.append(t1, t2, badge);
  g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
  g.addEventListener("mouseenter", ev => showTip(`${n.zh} ｜ ${n.en} ｜ 入 ${n.in.length} 出 ${n.out.length}`, ev));
  g.addEventListener("mouseleave", hideTip);
  nodeLayer.appendChild(g);
  n.el = g;
  n.badge = badge;
});

let selected = null, typeFilter = null, invalidOnly = false, spotlight = false;
const dirSel = document.getElementById("dir");

function autoDir(n) {
  if (n.kind === "input") return "down";
  if (n.kind === "out") return "up";
  if (n.out.length && !n.in.length) return "down";
  if (n.in.length && !n.out.length) return "up";
  return "both";
}

/** BFS 记跳数；maxDepth 用于聚光灯模式 */
function depths(startId, dir, maxDepth) {
  const map = new Map([[startId, 0]]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    const d = map.get(cur);
    if (d >= maxDepth) continue;
    const node = byId.get(cur);
    const list = dir === "down" ? node.out : dir === "up" ? node.in : node.out.concat(node.in);
    for (const e of list) {
      const nxt = e.f === cur ? e.t : e.f;
      if (!map.has(nxt)) { map.set(nxt, d + 1); queue.push(nxt); }
    }
  }
  return map;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const hits = q
    ? new Set(NODES.filter(n => `${n.zh} ${n.en} ${n.mean} ${n.consumers} ${n.producer}`
        .toLowerCase().includes(q)).map(n => n.id))
    : null;

  let dist = null;
  if (invalidOnly) {
    dist = new Map();
    EDGES_OK.filter(e => e.type === "invalidate").forEach(e => {
      dist.set(e.f, 1); dist.set(e.t, 1);
    });
  } else if (selected) {
    const dir = dirSel.value === "auto" ? autoDir(byId.get(selected)) : dirSel.value;
    dist = depths(selected, dir, spotlight ? 1 : 2);
  }

  const nodeVisible = new Map();
  NODES.forEach(n => {
    const cls = ["node", `k-${n.kind}`];
    let vis = true;
    let badge = "";
    if (dist) {
      const d = dist.has(n.id) ? dist.get(n.id) : Infinity;
      if (d === 0) cls.push("sel");
      else if (d === 1) { cls.push("d1"); badge = "1 跳"; }
      else if (d === 2) { cls.push("d2"); badge = "2 跳"; }
      else vis = false;
    }
    if (hits) {
      if (hits.has(n.id)) cls.push("hit");
      else if (!dist) vis = false;
    }
    if (!vis) cls.push((dist || hits) && (onlyHide()) ? "gone" : "dim");
    nodeVisible.set(n.id, vis);
    n.el.setAttribute("class", cls.join(" "));
    n.badge.textContent = badge;
  });

  EDGES_OK.forEach(e => {
    const cls = ["edge", `t-${e.type}`];
    if (e.off) cls.push("off");
    let vis = true;
    if (typeFilter && e.type !== typeFilter) vis = false;
    if (invalidOnly && e.type !== "invalidate") vis = false;
    if (!nodeVisible.get(e.f) || !nodeVisible.get(e.t)) vis = false;
    const direct = selected !== null && (e.f === selected || e.t === selected);
    if (dist && selected && !direct) {
      const inChain = dist.has(e.f) && dist.has(e.t);
      if (!inChain) vis = false;
    }
    if (direct) cls.push("active");
    if (!vis) cls.push(onlyHide() ? "gone" : "dim");
    e.el.setAttribute("class", cls.join(" "));
    e.labelEl.setAttribute("class", `elabel${direct && vis ? " show" : ""}`);
  });
}

function onlyHide() {
  return spotlight || invalidOnly || !!document.getElementById("search").value.trim();
}

function select(id) {
  selected = id;
  invalidOnly = false;
  document.getElementById("onlyInvalid").classList.remove("on");
  render();
  paintPanel(id);
}

function clearSel() {
  selected = null;
  render();
  paintIntro();
}

function edgeRow(e) {
  const other = e.f === document.activePanelId ? byId.get(e.t) : byId.get(e.f);
  const arrow = e.f === document.activePanelId ? "→" : "←";
  return `<div class="er" data-id="${other.id}"><b>${arrow} ${other.zh}</b>
    <span class="tag">（${TYPES[e.type].name}${e.off ? " · 已停用" : ""}｜列 ${other.col + 1} ${COLS[other.col]}）</span><br>
    <span class="how">${e.label}</span>
    <div class="code">${other.en}</div></div>`;
}

function paintPanel(id) {
  document.activePanelId = id;
  const n = byId.get(id);
  const all = n.out.concat(n.in);
  const groups = new Map();
  all.forEach(e => {
    const other = e.f === id ? byId.get(e.t) : byId.get(e.f);
    const key = `列 ${other.col + 1}　${COLS[other.col]}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  const body = [...groups.entries()]
    .map(([g, list]) => `<div class="grp">${g}</div>${list.map(edgeRow).join("")}`)
    .join("");
  document.getElementById("panelBody").innerHTML = `
    <h2>${n.zh}</h2><div class="code">${n.en}</div>
    <h3>是什么</h3><p>${n.mean}</p>
    <h3>谁产生</h3><p>${n.producer}</p>
    <h3>谁消费</h3><p>${n.consumers}</p>
    <h3>与它相关的 ${all.length} 条引用（点行跳过去）</h3>
    ${body || "<p>无关联</p>"}
    <h3>代码出处</h3><p class="code">${n.src}</p>`;
  document.querySelectorAll("#panelBody .er").forEach(row =>
    row.addEventListener("click", () => select(row.dataset.id)));
}

function paintIntro() {
  document.getElementById("panelBody").innerHTML = `
    <h2>这张图怎么读</h2>
    <p>左到右：<span class="code">输入 → 动作 → 产物 → 动作 → 端点 → 产物</span>。
    淡紫底的是<strong>动作</strong>（一次调用或一次拼装），白底的是<strong>数据</strong>。</p>
    <ul>
      <li><strong>点任意方块</strong>：紧邻的标「1 跳」，次级标「2 跳」，更远的淡出；
          与它直接相连的线上会<strong>直接写出用途</strong>。</li>
      <li><strong>方向自动</strong>：输入类只展开下游，产物类只展开上游，动作与数据类两侧都展开。</li>
      <li><strong>聚光灯</strong>：把非紧邻的内容整块隐藏，只留这条链。</li>
      <li><strong>只看失效级联</strong>：一次看完「改哪里会毁掉哪些已完成产物」。</li>
      <li>线色＝引用方式（点图例单筛一类）；淡显的线＝已停用的引用，保留是为说明为什么停。</li>
    </ul>
    <h3>先试这三下</h3>
    <ul>
      <li>点「想法原文」→ 直接看到它喂给了 6 个动作。</li>
      <li>点「资产参考图」→ 看它被谁选走，以及它一变会毁掉什么。</li>
      <li>点顶部「步3 分镜」→ 看逐镜头细化吃了哪三样、吐了哪七样。</li>
    </ul>
    <h3>数据出处</h3>
    <p class="code">2026-09-21 源码快照；与 docs/execution-flow.md、docs/idea-breakdown.md 同一轮逐条核对结果。</p>`;
}

const legend = document.getElementById("legend");
Object.entries(TYPES).forEach(([key, t]) => {
  const s = document.createElement("span");
  s.title = "点击只看这一类引用";
  s.innerHTML = `<i style="border-top-style:${t.dash || "solid"};border-top-color:${t.color}"></i>${t.name}`;
  s.addEventListener("click", () => {
    typeFilter = typeFilter === key ? null : key;
    [...legend.children].forEach(c => c.classList.toggle("on", c === s && typeFilter === key));
    render();
  });
  legend.appendChild(s);
});

const STEPS = [
  ["想法", "idea"], ["步1 提取", "actAssets"], ["步2 资产图", "actAssetBatch"],
  ["步3 分镜", "actShot"], ["步4 图片", "actImageBatch"], ["步5 视频", "actVideoBatch"],
  ["步6 成片", "apiFfmpeg"],
];
const stepsBox = document.getElementById("steps");
STEPS.forEach(([label, id]) => {
  const b = document.createElement("button");
  b.textContent = label;
  b.addEventListener("click", () => select(id));
  stepsBox.appendChild(b);
});

document.getElementById("search").addEventListener("input", render);
dirSel.addEventListener("change", render);
document.getElementById("reset").addEventListener("click", clearSel);
document.getElementById("onlyRelated").addEventListener("click", ev => {
  spotlight = !spotlight;
  ev.currentTarget.classList.toggle("on", spotlight);
  render();
});
const invalidBtn = document.getElementById("onlyInvalid");
invalidBtn.addEventListener("click", () => {
  invalidOnly = !invalidOnly;
  invalidBtn.classList.toggle("on", invalidOnly);
  if (invalidOnly) selected = null;
  render();
});
svg.addEventListener("dblclick", clearSel);

const stage = document.getElementById("stage");
let scale = 1;
function applyScale() {
  svg.style.width = `${W * scale}px`;
  svg.style.height = `${H * scale}px`;
}
applyScale();
document.getElementById("fit").addEventListener("click", () => {
  scale = Math.min(1.6, Math.max(.25, (stage.clientWidth - 24) / W));
  applyScale();
});
stage.addEventListener("wheel", ev => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  scale = Math.min(2.4, Math.max(.25, scale * (ev.deltaY < 0 ? 1.12 : 0.9)));
  applyScale();
}, { passive: false });
let drag = null;
stage.addEventListener("mousedown", ev => {
  if (ev.target.closest(".node")) return;
  drag = { x: ev.clientX, y: ev.clientY, l: stage.scrollLeft, t: stage.scrollTop };
  stage.classList.add("dragging");
});
window.addEventListener("mousemove", ev => {
  if (!drag) return;
  stage.scrollLeft = drag.l - (ev.clientX - drag.x);
  stage.scrollTop = drag.t - (ev.clientY - drag.y);
});
window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });

const tip = document.getElementById("tip");
function showTip(text, ev) {
  tip.textContent = text;
  tip.style.left = `${Math.max(8, Math.min(innerWidth - 580, ev.clientX + 14))}px`;
  tip.style.top = `${ev.clientY + 16}px`;
  tip.style.opacity = "1";
}
function hideTip() { tip.style.opacity = "0"; }

document.getElementById("theme").addEventListener("click", () => {
  document.documentElement.dataset.theme =
    document.documentElement.dataset.theme === "dark" ? "light" : "dark";
});

paintIntro();
render();
</script>
</body>
</html>
